<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>YT Transcript Downloader Options</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="options-container">
    <h1>Settings</h1>

    <div class="section">
      <h2>General Defaults</h2>
      <div class="form-group">
        <label>Default Format:</label>
        <select id="default-format">
          <option value="txt">TXT</option>
          <option value="md">Markdown</option>
          <option value="json">JSON</option>
          <option value="csv">CSV</option>
          <option value="srt">SRT</option>
          <option value="vtt">VTT</option>
        </select>
      </div>

      <div class="form-group">
        <label>Filename Template:</label>
        <input type="text" id="filename-template" placeholder="{date}_{title}_{videoId}.{ext}">
        <p class="help-text">Available variables: {date}, {title}, {videoId}, {channel}, {lang}, {ext}</p>
      </div>
    </div>

    <div class="section">
      <h2>AI Integration</h2>
      <div class="form-group">
        <label>API Key:</label>
        <div class="password-wrapper">
          <input type="password" id="api-key" placeholder="sk-...">
          <button id="toggle-api-key">👁️</button>
        </div>
      </div>

      <div class="form-group">
        <label>API Endpoint:</label>
        <input type="text" id="api-endpoint" placeholder="https://api.openai.com/v1/chat/completions">
      </div>

      <div class="form-group">
        <label>Model:</label>
        <input type="text" id="api-model" placeholder="gpt-4o-mini">
      </div>

      <div class="form-group">
        <label>System Prompt:</label>
        <textarea id="system-prompt" rows="4"></textarea>
      </div>
    </div>

    <div class="actions">
      <button id="save-btn" class="primary">Save Settings</button>
      <span id="status-msg"></span>
    </div>
  </div>
  <script src="../lib/storage-manager.js"></script>
  <script src="options.js"></script>
</body>
</html>
